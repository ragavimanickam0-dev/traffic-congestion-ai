<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - TrafficIntel AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-bg-base);
      padding: 2rem 1rem;
    }
    .auth-card {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
      box-shadow: var(--shadow-md);
      padding: 2.25rem;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="d-inline-flex align-items-center gap-2 mb-2 text-decoration-none">
          <span class="badge bg-primary p-2 rounded-2"><i class="bi bi-radar text-white fs-5"></i></span>
          <span class="fw-bold text-navy-dark fs-4 tracking-tight">TrafficIntel <span class="text-primary">AI</span></span>
        </a>
        <h5 class="fw-bold text-navy-dark mt-2 mb-1">Create an Account</h5>
        <p class="text-slate small mb-0">Join the predictive traffic and mobility platform</p>
      </div>

      <div id="registerAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

      <form id="registerForm">
        <div class="mb-3">
          <label for="name" class="form-label small fw-semibold text-slate">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0" id="name" required placeholder="Alex Rivera">
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold text-slate">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="email" required placeholder="name@company.com">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold text-slate">Password (min 6 characters)</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" id="password" required minlength="6" placeholder="••••••••">
          </div>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label small fw-semibold text-slate">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
            <input type="password" class="form-control border-start-0" id="confirmPassword" required minlength="6" placeholder="••••••••">
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fw-medium mb-3">
          Create Account
        </button>
      </form>

      <div class="text-center pt-3 border-top">
        <span class="small text-slate">Already have an account? </span>
        <a href="login.html" class="small fw-semibold">Sign in</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirmPassword');
      const alertBox = document.getElementById('registerAlert');
      const btnSubmit = document.getElementById('btnSubmit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (password !== confirm) {
          alertBox.textContent = 'Passwords do not match.';
          alertBox.classList.remove('d-none');
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

        try {
          const res = await authAPI.register(name, email, password);
          if (res && res.access_token) {
            localStorage.setItem('traffic_token', res.access_token);
            localStorage.setItem('traffic_user', JSON.stringify(res.user));
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'login.html?registered=1';
          }
        } catch (err) {
          alertBox.textContent = err.message || 'Registration failed. Please try again.';
          alertBox.classList.remove('d-none');
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
